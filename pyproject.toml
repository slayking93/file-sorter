[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-sorter"
version = "0.1.0"
description = "CLI utility that sorts files in a folder into subfolders by extension."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
sort = "sort:main"

[tool.setuptools]
py-modules = ["sort"]

[tool.setuptools.packages.find]
include = ["src*"]